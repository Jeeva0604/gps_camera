name: gps_camera
description: "A GPS Camera app for iOS and Android that embeds GPS coordinates, address, timestamp, and a map snapshot onto captured photos."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  geolocator: ^13.0.1
  image: ^4.2.0
  http: ^1.2.1
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fluttertoast: ^10.0.2
  video_player: ^2.14.1
  hugeicons: ^4.4.0
  shared_preferences: ^2.5.6
  in_app_review: ^2.0.12
  in_app_update_flutter: ^3.0.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/font/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/font/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/font/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/font/GoogleSans-Bold.ttf
          weight: 700
